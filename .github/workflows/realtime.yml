# 盤中即時監控：每個交易日早上自動啟動，在 GitHub 雲端跑到收盤，有訊號就推播到手機。
# 不用開電腦。休市日會自動偵測並結束。盤中也會跑台指期日內順勢突破訊號（trade/futures_day.py，推進出場機器人；手動勾「check」可確認台指期報價欄位）。
# 也可以在 Actions 頁面按「Run workflow」手動啟動（例如盤中臨時想開）。
name: realtime

on:
  schedule:
    - cron: "35 0 * * 1-5"   # 台北時間 08:35 啟動；GitHub 排程常延遲數十分鐘、甚至整天漏掉，所以 watch.yml 會在 08:36 後檢查、沒起來就補啟動
  workflow_dispatch:
    inputs:
      test:
        description: "測試模式：只抓一次快照並推播（非交易時段也會執行）"
        type: boolean
        default: false
      check:
        description: "資料檢查：只印出資料來源原始欄位，不推播"
        type: boolean
        default: false

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 排程補跑檢查（收盤後才排到的排程直接略過，不浪費時間）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$((10#$(TZ=Asia/Taipei date +%H%M)))" -ge 1335 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已過 13:35，這次排程略過"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.skip != 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ steps.gate.outputs.skip != 'true' }}
      - name: 安裝中文字型（題材卡圖片；最多等 3 分鐘，失敗也不擋盤中監控）
        if: ${{ steps.gate.outputs.skip != 'true' }}
        timeout-minutes: 3
        continue-on-error: true
        run: fc-list | grep -qi "Noto Sans CJK" || sudo apt-get install -y -q fonts-noto-cjk >/dev/null || (sudo apt-get update -q >/dev/null && sudo apt-get install -y -q fonts-noto-cjk >/dev/null)
      - name: 盤中監控（到 13:35 自動結束）
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_NEWS_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          TELEGRAM_PICKS_BOT_TOKEN: ${{ secrets.TELEGRAM_PICKS_BOT_TOKEN }}
          TELEGRAM_PICKS_CHAT_ID: ${{ secrets.TELEGRAM_PICKS_CHAT_ID }}
          TELEGRAM_RESEARCH_BOT_TOKEN: ${{ secrets.TELEGRAM_RESEARCH_BOT_TOKEN }}
          TELEGRAM_RESEARCH_CHAT_ID: ${{ secrets.TELEGRAM_RESEARCH_CHAT_ID }}
          TELEGRAM_TRADE_BOT_TOKEN: ${{ secrets.TELEGRAM_TRADE_BOT_TOKEN }}
          TELEGRAM_TRADE_CHAT_ID: ${{ secrets.TELEGRAM_TRADE_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.check }}" = "true" ]; then
            python -m market_intel check
          elif [ "${{ inputs.test }}" = "true" ]; then
            python -m market_intel realtime --once --force
          else
            python -m market_intel realtime --until 13:35
          fi
      - name: 存檔題材卡與研究佇列記錄
        if: ${{ !cancelled() && inputs.check != true && steps.gate.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d state ] || exit 0
          git add -A state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "盤中記錄 $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do
            # 與 watch 同時改到 state 檔會衝突：以這次盤中記錄為準（-X theirs），不要讓整個執行變紅
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          echo "存檔一直衝突，放棄這次記錄（不影響已推播的內容）"
          exit 0
