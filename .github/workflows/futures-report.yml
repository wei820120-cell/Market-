# 微台計畫帳績效推播（market_intel/trade/futures_log.py 的 performance_text）：累計損益、勝率、最近幾場、進行中的場次，推到微台機器人（沒設定微台機器人時退回進出場機器人）。
# 手動執行（workflow_dispatch，在 GitHub 的 Actions 頁面按 Run workflow）；不再因為改檔自動執行（避免意外推播）。
# 狀態檔（state/）在非 main 分支執行時改用 main 最新版，才看得到最新的場次與進行中的損益。
name: futures-report
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futures-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 狀態檔改用 main 最新版（開發分支執行時）
        if: github.ref_name != 'main'
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- state/futures_log.json state/futures_day.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 績效推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TRADE_BOT_TOKEN: ${{ secrets.TELEGRAM_TRADE_BOT_TOKEN }}
          TELEGRAM_TRADE_CHAT_ID: ${{ secrets.TELEGRAM_TRADE_CHAT_ID }}
          TELEGRAM_FUTURES_BOT_TOKEN: ${{ secrets.TELEGRAM_FUTURES_BOT_TOKEN }}
          TELEGRAM_FUTURES_CHAT_ID: ${{ secrets.TELEGRAM_FUTURES_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m market_intel futures-report
