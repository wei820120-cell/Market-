# 產業消息頻道：手動測試用。平常由 watch.yml 每 2 分鐘檢查（config/sources.yaml）。
# 已推過的貼文編號記在 state/telegram_seen.json。
name: channels

on:
  workflow_dispatch:
    inputs:
      latest:
        description: "測試：直接推最新 N 則（0＝正常模式，只推新貼文）"
        default: "0"

permissions:
  contents: write

concurrency:
  group: channels
  cancel-in-progress: false

jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查頻道新貼文
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_NEWS_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          TELEGRAM_PICKS_BOT_TOKEN: ${{ secrets.TELEGRAM_PICKS_BOT_TOKEN }}
          TELEGRAM_PICKS_CHAT_ID: ${{ secrets.TELEGRAM_PICKS_CHAT_ID }}
          TELEGRAM_RESEARCH_BOT_TOKEN: ${{ secrets.TELEGRAM_RESEARCH_BOT_TOKEN }}
          TELEGRAM_RESEARCH_CHAT_ID: ${{ secrets.TELEGRAM_RESEARCH_CHAT_ID }}
        run: python -m market_intel channels --latest "${{ inputs.latest || '0' }}"
      - name: 存檔已讀記錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d state ] || exit 0   # 測試模式（latest）不會寫入已讀記錄
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "頻道已讀記錄 $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1
