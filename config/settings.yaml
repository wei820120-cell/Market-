realtime:
  interval_seconds: 20        # 盤中報價更新間隔（證交所 MIS 約 5 秒更新，太頻繁可能被暫時封鎖）
  news_interval_seconds: 60   # 新聞 / 重大訊息掃描間隔
  top_themes: 12              # 終端機顯示前幾名族群
  alert_theme_pace: 2.0       # 族群量能步調 >= 此倍數且上漲時推播「資金湧入」
  alert_stock_pct: 7.0        # 個股漲幅 >= 此 % 時推播
  news_min_score: 3           # 盤中新聞分數 >= 此值才推播（3 = 至少命中「漲價」，或兩個利多類別）
  flow_push_times: ["09:15", "10:00", "11:00", "12:00", "13:00", "13:25"]   # 定時推播族群資金流向排行
  volprice_watch:             # 題材群「量增價未漲」觀察預警（推研究機器人；回測：不是進場訊號，只是比突破更早盯上）
    enabled: true
    start: "10:00"            # 開盤前段量能步調不穩，10:00 之後才看
    min_pace: 3.0             # 量能步調（累積量 ÷ 20 日均量 ÷ 同時段正常比例）>= 此倍數
    min_pct: -1.0             # 今日漲幅在 min_pct～max_pct（%）之間才算「價格還沒動」
    max_pct: 3.0
    max_per_day: 6            # 每天最多預警幾檔
    repeat_days: 3            # 同一檔幾天內不重複預警
    study_days: 30            # 研究過的題材（近幾天內）整群納入觀察
    queue_research: true      # 預警到、研究庫沒有任何研究提到的個股，順便排進研究
    queue_max_per_day: 3

research:                     # 題材研究員（需要 GitHub Secret：ANTHROPIC_API_KEY）
  model: claude-haiku-5-5     # 研究用的 Claude 模型。Haiku 5.5 試跑和碩：約 US$0.13／題、品質足夠（Sonnet 5.5 約 US$2／題；要更深入改 claude-sonnet-5-5 或 claude-opus-5-5）
  effort: high                # 研究深度：low / medium / high / xhigh / max（越深越貴）
  max_searches: 8             # 每個題材最多網路搜尋次數（搜回的網頁內容是主要花費）
  max_fetches: 4              # 每個題材最多讀取網頁次數
  max_per_day: 4              # 每天「自動」研究的題材上限（新聞偵測的題材適用；股癌等追蹤頻道貼文偵測的題材、手動指令不受限，但都受每月預算限制）
  min_importance: 3           # 自動偵測的題材重要性 >= 此值才研究（1-5）
  monthly_budget_usd: 39      # 每月花費上限（美元），超過就停止，下個月自動恢復
  read_channel_images: true    # 頻道的圖片貼文：用便宜的視覺模型把圖中文字抄下來再推播／送去研究（每張不到 US$0.01）
  image_model: claude-haiku-5-5
  image_price_per_mtok: {input: 0.1, output: 0.5}   # Haiku 5.5 每百萬 token 美元（提示超過 10 萬 token 的部分較貴，圖片貼文用不到）
  push_to: research           # 推到研究機器人（沒設定時用新聞機器人）
  prefetch:                   # 連動預研：看到 A 就把 B、C 和上下游先排進研究，推播時才不會慢半拍
    enabled: true
    per_topic: 3              # 每份研究完成後，最多往外排幾檔相關個股（同層優先，其次上下游）
    per_day: 8                # 每天最多排幾檔（研究完成、新聞點名、市場掃描共用）
    max_depth: 2              # 最多往外擴幾層（A→B→C），不會無限擴下去
    stale_days: 3             # 已知族群的個股漲停，超過幾天沒有任何研究提到它，就重新排進研究
    expire_days: 3            # 預研排進佇列超過幾天還沒研究就丟掉
  # 以下用來估算花費，請以 Anthropic 官網價格為準
  price_per_mtok: {input: 2, output: 10}   # 預設單價（Sonnet 5.5）；Haiku 5.5 的單價在 ai.MODEL_PRICES，換模型會自動套用
  web_search_usd_per_1k: 10                # 網路搜尋每千次美元

premarket:                    # 開盤前環境：台指期夜盤、美股收盤、那指期貨、亞股早盤 → 風險燈號（只做參考，不擋單）
  enabled: true
  night_yellow: -0.8          # 台指期夜盤跌幅 %（相對前一日結算價）：黃燈／紅燈
  night_red: -1.5
  nasdaq_yellow: -1.2         # 那斯達克（也套用在那指期貨）
  nasdaq_red: -2.0
  sox_yellow: -2.0            # 費城半導體（台股權值股與 AI 供應鏈最直接）
  sox_red: -3.0
  asia_yellow: -1.0           # 日經、韓國綜合的平均漲跌（早上 08:30 已開盤 30 分鐘）
  asia_red: -2.0
  vix_yellow: 25              # VIX 水位
  vix_red: 30
  bull_night: 0.8             # 沒有黃紅燈、且夜盤漲幅達此值（或那指 +1.2%）時標示「隔夜偏多」

futures_day:                  # 台指期日內順勢突破（@pingyunhuang 手法，筆記：knowledge/methods/）：盤面合格才叫你進場／加碼／出場，只發訊號不下單
  enabled: true
  contract: 微台              # 操作的契約名稱（只用在訊息文字）；訊號來源一律用台指期近月（TXF）報價，微台與它同價同步
  contract_multiplier: 10     # 每點多少元：微台 10、小台 50、大台 200（損益與「當日虧損上限」的換算）
  capital: 1000000            # 台指期的操作資金（原文：台指至少 100 萬）——請改成你實際放在期貨的錢
  unit_lots: 1                # 每次進場／加碼幾口（微台每口只有大台的 1/20，想放大請調這裡）
  max_lots: 4                 # 滿倉口數上限（原文：單筆 1 口，新手從 1:4 開始，他自己 1:120；微台一口很小，要放大比值就調高）
  active_range_pct: 1.0       # 日內高低差 ≥ 此 % 才算真正行情、才准加碼（原文 120 點；依 10/30 成交明細校準：他第一筆後約在振幅 1.0% 才開始連續加碼）
  early_trend_pct: 0.9        # 09:30 前就達到 → 標示「早盤動能強」（原文 9 點半超過 100 點）
  ext_add_pct: 0.04           # 順勢加碼：再創日內新高／新低、比上一筆成交又多走這麼多 %（他的成交每約 14～55 點加 1 口，約 0.03～0.12%）
  ext_add_gap_sec: 15         # 順勢加碼：兩次加碼至少隔幾秒（他最密的兩筆相隔 20 秒）
  bar_range_pct: 1.07         # 斷頭日型（日線連漲／連跌 3 天以上）：5 分 K 高低差 ≥ 此 % 就提早全出（原文 80 點）
  tick_jump_pct: 0.27         # 同上：相鄰兩筆報價跳動 ≥ 此 %（原文 tick 跳動 20 點）
  stop_pct: 0.15              # 跌破（做空則突破）平均成本多少 % 全出；原文只說「依均價設停損」，沒給數字
  daily_loss_pct: 3.0         # 當日虧損上限（占資金 %）：原文 3～5%，加碼後很少超過 5%
  entry_start: "09:00"        # 之後的突破才進場（先用開盤前 15 分鐘建立今日高低點）
  entry_until: "12:30"        # 這之後不再進場（原文沒說，保守設定）
  exit_times: ["13:10", "13:25"]   # 第一次出一半、第二次全出（盤中監控約 13:35 結束；原文：抱到快收盤才分批）
  max_entries: 2              # 一天最多進場幾次（含停損後重進）
  min_open_range_pct: 0.3     # 進場前日內高低差至少 % ，避免平盤時被小突破觸發
