# 重大總經／地緣事件：命中標題或摘要的正規表示式 → 推新聞機器人（同一事件一天一次）並排入研究佇列。
# themes 是「初步推論」，方向 + 受惠、- 受傷、? 要看細節；族群名稱要和 themes.yaml 一致。推論未經驗證，研究完成才算數。
events:
  俄烏停火與能源:
    patterns: ['能源停火', '停攻.{0,4}能源', '能源.{0,6}(停火|停攻|休戰)', '俄烏.{0,8}(停火|停戰|和談|談判)', '烏克蘭.{0,12}(煉油廠|柴油)', 'energy (ceasefire|truce)', 'Ukraine.{0,40}ceasefire']
    topic: 俄烏停火與能源價格
    watch: ['BZ=F', 'HO=F', 'NG=F', 'DX-Y.NYB']
    themes:
      航空: ['+', '油價若走弱，燃油成本下降']
      航運: ['+', '燃油成本下降（運價仍看供需，不一定同步）']
      軍工航太: ['-', '戰事降溫，題材可能降溫']
  中東與航道:
    patterns: ['荷莫茲', 'Hormuz', '伊朗.{0,8}(攻擊|空襲|戰事|開戰|停火|封鎖)', '紅海.{0,8}(攻擊|封鎖|航運|繞道)']
    topic: 中東局勢與航運油價
    watch: ['BZ=F', 'HO=F', 'GC=F', '^VIX']
    themes:
      航運: ['+', '繞道、運力吃緊時運價上升']
      航空: ['-', '油價上揚、航線受影響']
      軍工航太: ['+', '地緣風險升溫']
  聯準會與利率:
    patterns: ['聯準會.{0,8}(降息|升息|利率決策|按兵不動)', 'Fed.{0,20}(rate cut|rate hike|holds rates)']
    topic: 聯準會利率決策對台股的影響
    watch: ['^TNX', 'DX-Y.NYB', 'TWD=X', '^SOX', '^VIX']
    themes:
      金融: ['?', '看降息或升息方向']
      AI伺服器: ['?', '成長股評價對利率敏感']
  OPEC與油價:
    patterns: ['OPEC.{0,12}(減產|增產|會議|decision)']
    topic: OPEC產量決策與油價
    watch: ['BZ=F', 'CL=F', 'HO=F']
    themes:
      航空: ['?', '油價方向決定燃油成本']
      航運: ['?', '燃油成本']
  關稅與晶片管制:
    patterns: ['關稅.{0,14}(半導體|晶片|電子|台灣|232)', '晶片.{0,8}出口管制', 'chip.{0,30}export controls?', 'semiconductor.{0,30}tariffs?']
    topic: 關稅與晶片出口管制
    watch: ['^SOX', 'DX-Y.NYB', 'TWD=X', 'HG=F']
    themes:
      晶圓代工: ['?', '看稅率與豁免條件']
      AI伺服器: ['?', '看出貨地區與豁免']
  台海局勢:
    patterns: ['台海.{0,6}(軍演|緊張|封鎖|危機)', '共軍.{0,6}(軍演|演習)']
    topic: 台海局勢升溫
    watch: ['TWD=X', 'GC=F', '^VIX', '^SOX']
    themes:
      軍工航太: ['+', '地緣風險升溫']
      航運: ['-', '航線與保險風險']
      金融: ['-', '風險偏好下降']
