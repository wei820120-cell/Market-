# 重大總經／地緣事件：命中標題或摘要的正規表示式 → 推新聞機器人（同一事件一天一次）並排入研究佇列。
# themes 是「初步推論」，方向 + 受惠、- 受傷、? 要看細節；族群名稱要和 themes.yaml 一致。推論未經驗證，研究完成才算數。
events:
  俄烏停火與能源:
    patterns: ['能源停火', '停攻.{0,4}能源', '能源.{0,6}(停火|停攻|休戰)', '俄烏.{0,8}(停火|停戰|和談|談判)', '烏克蘭.{0,12}(煉油廠|柴油)', 'energy (ceasefire|truce)', 'Ukraine.{0,40}ceasefire']
    topic: 俄烏停火與能源價格
    watch: ['BZ=F', 'HO=F', 'NG=F', 'DX-Y.NYB']
    themes:
      航空: ['+', '油價若走弱，燃油成本下降']
      航運: ['+', '燃油成本下降（運價仍看供需，不一定同步）']
      軍工航太: ['-', '戰事降溫，題材可能降溫']
  中東與航道:
    patterns: ['荷莫茲', 'Hormuz', '伊朗.{0,8}(攻擊|空襲|戰事|開戰|停火|封鎖)', '紅海.{0,8}(攻擊|封鎖|航運|繞道)']
    topic: 中東局勢與航運油價
    watch: ['BZ=F', 'HO=F', 'GC=F', '^VIX']
    themes:
      航運: ['+', '繞道、運力吃緊時運價上升']
      航空: ['-', '油價上揚、航線受影響']
      軍工航太: ['+', '地緣風險升溫']
  聯準會與利率:
    patterns: ['聯準會.{0,8}(降息|升息|利率決策|按兵不動)', 'Fed.{0,20}(rate cut|rate hike|holds rates)']
    topic: 聯準會利率決策對台股的影響
    watch: ['^TNX', 'DX-Y.NYB', 'TWD=X', '^SOX', '^VIX']
    themes:
      金融: ['?', '看降息或升息方向']
      AI伺服器: ['?', '成長股評價對利率敏感']
  OPEC與油價:
    patterns: ['OPEC.{0,12}(減產|增產|會議|decision)']
    topic: OPEC產量決策與油價
    watch: ['BZ=F', 'CL=F', 'HO=F']
    themes:
      航空: ['?', '油價方向決定燃油成本']
      航運: ['?', '燃油成本']
  關稅與晶片管制:
    patterns: ['關稅.{0,14}(半導體|晶片|電子|台灣|232)', '晶片.{0,8}出口管制', 'chip.{0,30}export controls?', 'semiconductor.{0,30}tariffs?']
    topic: 關稅與晶片出口管制
    watch: ['^SOX', 'DX-Y.NYB', 'TWD=X', 'HG=F']
    themes:
      晶圓代工: ['?', '看稅率與豁免條件']
      AI伺服器: ['?', '看出貨地區與豁免']
  台海局勢:
    patterns: ['台海.{0,6}(軍演|緊張|封鎖|危機)', '共軍.{0,6}(軍演|演習)']
    topic: 台海局勢升溫
    watch: ['TWD=X', 'GC=F', '^VIX', '^SOX']
    themes:
      軍工航太: ['+', '地緣風險升溫']
      航運: ['-', '航線與保險風險']
      金融: ['-', '風險偏好下降']
  龍頭高層異動與治理風險:      # 2026-11-12 加：黃仁勳請辭時，標題沒有漲價／缺貨等關鍵字、也不在上面幾類，新聞機器人完全沒推
    patterns: ['(黃仁勳|輝達|nvidia).{0,16}(辭職|請辭|辭任|辭去|下台|卸任|撤換|解職|離職|去留|代理執行長|暫代執行長|臨時執行長|接班|遴選)',
               '(台積電|蘋果|微軟|超微|AMD|博通|美光|三星|SK海力士|鴻海|聯發科|谷歌|Google|亞馬遜|Meta|特斯拉).{0,10}(執行長|CEO|董事長|總裁).{0,8}(辭職|請辭|辭任|下台|卸任|撤換|解職|離職)',
               '(Nvidia|Huang).{0,40}(resign|steps? down|ousted|replaced)']
    topic: 龍頭企業高層異動對AI供應鏈的影響
    watch: ['^SOX', '^IXIC', 'NQ=F', '^VIX']
    themes:
      AI伺服器: ['?', '輝達為主要客戶，看接班人選、財報（輝達預定 11/17）與訂單是否改變']
      晶圓代工: ['?', '先進製程與 CoWoS 需求是否受影響，看法人與公司說法']
  龍頭高層復職與治理反轉:      # 2026-11-23 加：黃仁勳 11/23 復職（輝達董事會一致恢復、盤前 +25%），標題是「回來了、宣布即刻復職」，上一條只認離職字眼沒命中，
                               # 而且那一條 11/23 凌晨已推過、同一事件一天只推一次，就算命中也會被擋。這條獨立計額度，只看標題、要有「公司已宣布」的字眼，
                               # 並排除呼籲、喊話、傳聞、機率這類還沒發生的標題（川普、貝森特 11/20～11/23 的喊話標題不會用掉額度）。
    title_only: true
    max_per_day: 3
    patterns: ['^(?=.*黃仁勳)(?=.*(宣布|宣佈|官宣|證實|公告|一致|通過|同意|決議|即刻|立即|正式)).*(復職|恢復.{0,8}(職務|執行長|CEO|總裁)|重掌.{0,4}(輝達|執行長|CEO|兵符)|重返.{0,4}(輝達|執行長|CEO)|回任.{0,4}(執行長|CEO)|回聘)',
               '^(?=.*黃仁勳).*(官復原職|董事會(一致|同意|決定|批准|正式)?(恢復|重新任命|重新聘任|重新聘回))',
               '^(?=.*(宣布|宣佈|官宣|證實|公告|一致|通過|同意|決議|即刻|立即|正式)).*(台積電|蘋果|微軟|超微|AMD|博通|美光|三星|SK海力士|鴻海|聯發科|谷歌|Google|亞馬遜|Meta|特斯拉).{0,10}(執行長|CEO|董事長|總裁).{0,8}(復職|官復原職|回任|重返|重掌|恢復職務)',
               '(Nvidia|Huang).{0,40}(reinstat|rehired|brings? back|brought back|(returns?|returned|back) (as|to) .{0,20}(CEO|chief))']
    exclude: ['呼籲', '喊話', '力挺', '籲', '盼', '要求', '機率', '可能', '能否', '是否', '會不會', '如果', '假如', '若', '傳聞', '傳出', '有望', '擬', '考慮', '評估', '研議',
              '遭拒', '拒絕', '無意', '不會', '不可能', '\burges?\b', '\bcalls? for\b', '\bpush(es)?\b', '\bpress(es|ures?)?\b', '\bwants?\b', '\bshould\b', '\bcould\b', '\bmight\b', '\bmay\b', '\bwould\b', '\bodds\b', '\bchances?\b']
    topic: 龍頭企業高層復職對AI供應鏈的影響
    watch: ['^SOX', '^IXIC', 'NQ=F', '^VIX']
    themes:
      AI伺服器: ['+', '領導不確定性下降，情緒面受惠；訂單與營收面沒有新證據，看財報與供應鏈說法']
      晶圓代工: ['?', '情緒面受惠；先進製程與 CoWoS 需求是否改變看法人與公司說法']
  低軌衛星與SpaceX:      # 2026-11-27 加：11/25（美東）FCC 有條件批准 SpaceX 部署太空資料中心衛星，台灣開盤前已公開，但新聞偵測與這張清單都沒有衛星類，
                          # 半夜沒抓到，研究排程第一輪又是 09:52；台股低軌衛星族群 11/26 一起漲停。命中就推新聞機器人（附 8 檔名單與既有研究）並排研究。
                          # 只看標題（摘要常提到別的事）、排除傳聞澄清類；一天最多 2 則（事件常有第二波：批准後的細節、美股反應）。族群名稱要和 themes.yaml 一致。
    title_only: true
    max_per_day: 2
    names_max: 8
    with_research: true
    patterns: ['(SpaceX|Space X|星鏈|Starlink|低軌衛星|太空資料中心|軌道資料中心).{0,24}(批准|核准|獲准|獲批|FCC|發射|上市|IPO|掛牌|財報|大單|漲停|概念股|供應鏈|百萬顆|擴大|合約|訂單|星座)',
               '(FCC|批准|核准|獲准|獲批).{0,16}(SpaceX|Space X|星鏈|Starlink|低軌衛星)',
               '(SpaceX|Starlink|Kuiper|Amazon Leo).{0,40}(FCC|approv|launch|IPO|constellation|satellites?)']
    exclude: ['傳聞', '謠言', '不實', '澄清', '闢謠']
    topic: 低軌衛星與SpaceX事件對台股供應鏈的影響
    watch: ['SPCX', '^SOX', 'NQ=F']
    themes:
      低軌衛星: ['+', '事件直接受惠：地面站、衛星天線、PCB 與射頻元件；有沒有訂單看各家公告與研究，不要只看題材']
      PCB銅箔基板: ['?', '衛星與地面站用高階板材／PCB 需求；看台光電、台燿等有沒有衛星訂單']
