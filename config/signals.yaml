# 早期訊號：供應鏈換料、轉單、淘汰、認證這類「還沒上媒體」的消息（頻道、論壇、使用者轉傳、媒體標題都用同一套偵測）。
# 偵測到就立刻推研究機器人（標「未證實」）並排入求證研究；同一件事一天只推一次，方向相反的訊號會特別標出來。

enabled: true
max_push_per_day: 12      # 每天最多推幾則早期訊號
max_queue_per_day: 6      # 每天最多排幾個求證研究
keep_days: 14             # 訊號記錄保留天數（用來比對重複與相反訊號）
min_text_len: 8           # 太短的貼文不看

# 終端客戶／平台（訊號裡要有它們，或使用者轉傳，才算供應鏈訊號）。鍵是顯示名稱，值是文字裡可能的寫法。
customers:
  AWS: [AWS, 亞馬遜, Amazon, Trainium, Inferentia]
  輝達: [輝達, NVIDIA, Nvidia, GB200, GB300, Rubin, NVL72, NVL144]
  谷歌: [谷歌, Google, TPU]
  Meta: [Meta, MTIA]
  微軟: [微軟, Microsoft, Maia, Azure]
  蘋果: [蘋果, Apple, iPhone]
  OpenAI: [OpenAI]
  特斯拉: [特斯拉, Tesla]
  超微: [超微, AMD]
  英特爾: [英特爾, Intel]
  高通: [高通, Qualcomm]
  博通: [博通, Broadcom]
  台積電: [台積電, TSMC]
  三星: [三星, Samsung]
  美光: [美光, Micron]
  SK海力士: [海力士, Hynix]

