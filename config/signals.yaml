# 會讓這家公司「受傷」的說法（主詞在前：台燿掉單、台燿認證失敗…）
loss_subject_cues: [不合格, 掉單, 丟單, 被砍單, 遭砍單, 砍單, 認證失敗, 測試失敗, 驗證失敗, 未通過, 沒通過, 沒過, 故障, 良率問題, 良率不佳, 良率偏低, 出局, 落馬, 被踢出, 遭踢出, 流失訂單, 訂單流失, 拉貨減少, 減量, 縮減]
# 被動句：「南亞 M9 遭 AWS 淘汰」「被取代」「被換掉」
passive_markers: [遭, 被]
elim_verbs: [淘汰, 剔除, 取代, 換掉, 踢出, 移出, 擠下, 頂替, 汰換]
# 這些字後面接的公司是「受惠」（轉單去哪、改用誰）
win_dest_cues: [訂單去, 訂單轉給, 訂單轉到, 訂單轉向, 訂單流向, 訂單歸, 轉單給, 轉單到, 轉向, 轉由, 改由, 改用, 改採, 交由, 轉給, 其中包括, 包括, 新增供應商, 第二供應商, 二供]
# 主詞在前的受惠說法：「X 拿下 / 打入 / 通過認證」
win_subject_cues: [拿下, 搶下, 搶到, 搶進, 打入, 切入, 入列, 取得訂單, 獲得訂單, 通過認證, 認證通過, 驗證通過, 通過驗證, 送樣, 擴大供貨, 追加訂單, 追單, 首度供貨]
# 「樣品測試結果樂觀」這類句子，主詞公司算受惠
win_result_patterns:
  - '(樣品|送樣|測試|驗證).{0,8}(樂觀|順利|良好|正面|通過)'
# 傳聞與澄清：媒體只寫「傳言＋公司說非事實」時（例如南亞董座說 M9 認證不合格傳言非事實），也要讓你知道有這個傳言以及公司的回應
rumor_words: [傳言, 傳聞, 市場傳出, 市場謠傳, 謠傳, 據傳, 傳出]
denial_words: [非事實, 不實, 澄清, 否認, 駁斥, 並無此事, 沒有此事, 假消息, 純屬謠言]

# 沒有明確角色也算「供應鏈變動」的字眼（使用者轉傳時用來判斷是不是情報）
change_words: [換料, 換供應商, 供應商調整, 供應鏈調整, 轉單, 掉單, 淘汰, 剔除, 移出, 認證, 驗證, 送樣, 拿下, 打入, 切入, 取代, 改用, 改由, 轉向]

# 技術／產品詞：沒有客戶名但有這些詞也可以算供應鏈訊號
product_terms: [CCL, 銅箔基板, M6, M7, M8, M9, M10, 玻纖布, 石英布, PTFE, HVLP, ABF, 載板, 高頻板, 液冷, CPO, 矽光子, HBM, CoWoS, 800G, 1.6T]
