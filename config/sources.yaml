# Podcast：新集數下載後用 faster-whisper 轉成逐字稿（state/podcasts/），值得看的段落放進 state/podcast_inbox/日期.json，
# 由研究員每小時檢視、決定有沒有要研究的東西；供應鏈換料／轉單的說法只排求證研究。不推播。轉文字很慢，由 podcast.yml 每 3 小時跑一次。
# 每個節目填 name 與 apple_id（Apple Podcasts 節目網址最後 id 後面的數字）或直接填 feed（RSS 網址）。
podcasts:
  - name: 股癌
    apple_id: 1500839292
podcast_model: small               # tiny／base／small／medium：越大越準也越慢（small 在 GitHub 的 4 核心 CPU 上約 3～6 倍速，待實測）
podcast_prompt: 以下是繁體中文的台灣財經投資節目「股癌」，主持人謝孟恭，會提到台積電、鴻海、廣達、緯創、台光電、台燿、南亞、聯茂、金像電、AWS、輝達、AI 伺服器、銅箔基板、CoWoS、HBM。
podcast_max_age_days: 7            # 超過幾天的集數不轉
podcast_max_minutes: 180           # 超過幾分鐘的集數不轉
podcast_max_mb: 300

# RSS／Atom 來源（公司新聞室、產業分析部落格、YouTube 頻道；雲端機房讀不到的網站（回 403）不要放 https://www.youtube.com/feeds/videos.xml?channel_id=… 等）
signal_feeds:
  - name: AWS What's New
    url: https://aws.amazon.com/about-aws/whats-new/recent/feed/
  - name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/

# 供應鏈關鍵字的 Google 新聞搜尋（比一般新聞詞表更早抓到「傳出」「供應鏈」這類消息）
signal_queries:
  - AWS 供應鏈 轉單
  - AWS Trainium 供應商 認證
  - AWS 淘汰 供應商
  - 輝達 供應鏈 淘汰 轉單
  - 輝達 新供應商 認證 通過
  - 蘋果 供應鏈 掉單 轉單
  - 谷歌 TPU 供應鏈 轉單
  - 台廠 掉單 訂單轉向
  - 供應鏈傳出 認證失敗 良率

# 業配／廣告：貼文含這些字就不推播、也不送去研究（正規表示式）
skip_patterns:
  - 詳情請看資訊欄
  - 立即領取
  - 優惠碼
  - 折扣碼
  - 折價券
  - 專屬優惠
  - 本集贊助
  - 贊助商
  - 業配
  - 限時優惠
  - 登入就能抽
  - 立即下載
  - 點擊下方連結

