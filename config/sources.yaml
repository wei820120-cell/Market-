# 主動追蹤的產業消息來源

# 公開 Telegram 頻道（填 t.me/ 後面的帳號）。每 10 分鐘檢查一次，新貼文依 push_to 推到對應機器人（股癌推到研究機器人）。
telegram_channels:
  - name: 股癌
    handle: Gooaye
    push_to: research    # news / picks / market / research

# ---------- 早期訊號來源（供應鏈換料、轉單、淘汰、認證：config/signals.yaml 的詞表） ----------
# 每個頻道貼文也會做早期訊號偵測（頻道設定 signal: false 可關掉）。要追更多頻道，在上面 telegram_channels 加帳號即可。
# 你自己看到的消息，直接傳給研究機器人：「情報 台燿掉AWS，訂單去南亞」（或不加「情報」直接貼，有公司＋轉單說法也會抓），
# 幾分鐘內就會偵測、推播（標未證實）並排入求證研究。

# PTT 看板（公開網頁版與 Atom 摘要）：實測 GitHub 機房回 403（PTT 擋資料中心 IP），所以預設關閉。
# 換到不被擋的環境執行時，把下面兩行取消註解即可（標題像供應鏈訊號的文章才抓內文）。
ptt_boards: []
#  - board: Stock
#    pages: 2

# Threads 個人帳號（填 @ 後面的帳號）：用無頭瀏覽器讀公開頁（串文＋回覆兩個分頁），每 5 分鐘掃一輪新貼文，
# 也會讀到他們回覆的原貼文（例如有人貼傳聞、被追蹤的人回「台燿掉AWS，訂單去南亞」，兩則都會進偵測）。最多 120 個。
# 他們發的東西不推播給你：供應鏈換料／轉單的訊號直接排入求證研究（研究好了才推）；其他提到公司或題材又有「有事發生」說法的貼文，
# 放進 state/threads_inbox/日期.json，由研究員每小時檢視、決定有沒有要研究的東西。
# 下面是使用者「追蹤中」82 個帳號裡讀得到完整帳號名稱的 80 個（make_investment_ea…、wusunenzymestinkyt… 在畫面上被截斷，沒加），再加上使用者後來給的 miulaviewpoint。
