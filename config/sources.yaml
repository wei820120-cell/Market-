# 主動追蹤的產業消息來源

# 公開 Telegram 頻道（填 t.me/ 後面的帳號）。每 10 分鐘檢查一次，新貼文依 push_to 推到對應機器人（股癌推到研究機器人）。
telegram_channels:
  - name: 股癌
    handle: Gooaye
    push_to: research    # news / picks / market / research

# ---------- 早期訊號來源（供應鏈換料、轉單、淘汰、認證：config/signals.yaml 的詞表） ----------
# 每個頻道貼文也會做早期訊號偵測（頻道設定 signal: false 可關掉）。要追更多頻道，在上面 telegram_channels 加帳號即可。
# 你自己看到的消息，直接傳給研究機器人：「情報 台燿掉AWS，訂單去南亞」（或不加「情報」直接貼，有公司＋轉單說法也會抓），
# 幾分鐘內就會偵測、推播（標未證實）並排入求證研究。

# PTT 看板（公開網頁版與 Atom 摘要）：實測 GitHub 機房回 403（PTT 擋資料中心 IP），所以預設關閉。
# 換到不被擋的環境執行時，把下面兩行取消註解即可（標題像供應鏈訊號的文章才抓內文）。
ptt_boards: []
#  - board: Stock
#    pages: 2

# Threads 個人帳號（填 @ 後面的帳號）：用無頭瀏覽器讀公開頁，每 5 分鐘看一次新貼文，也會讀到他們回覆的原貼文
# （例如有人貼傳聞、被追蹤的人回「台燿掉AWS，訂單去南亞」，兩則都會進早期訊號偵測）。最多 12 個。
threads_accounts:
  - bigmanj87

# RSS／Atom 來源（公司新聞室、產業分析部落格、YouTube 頻道；雲端機房讀不到的網站（回 403）不要放 https://www.youtube.com/feeds/videos.xml?channel_id=… 等）
signal_feeds:
  - name: AWS What's New
    url: https://aws.amazon.com/about-aws/whats-new/recent/feed/
  - name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/

# 供應鏈關鍵字的 Google 新聞搜尋（比一般新聞詞表更早抓到「傳出」「供應鏈」這類消息）
signal_queries:
  - AWS 供應鏈 轉單
  - AWS Trainium 供應商 認證
  - AWS 淘汰 供應商
  - 輝達 供應鏈 淘汰 轉單
  - 輝達 新供應商 認證 通過
  - 蘋果 供應鏈 掉單 轉單
  - 谷歌 TPU 供應鏈 轉單
  - 台廠 掉單 訂單轉向
  - 供應鏈傳出 認證失敗 良率

# 業配／廣告：貼文含這些字就不推播、也不送去研究（正規表示式）
skip_patterns:
  - 詳情請看資訊欄
  - 立即領取
  - 優惠碼
  - 折扣碼
  - 折價券
  - 專屬優惠
  - 本集贊助
  - 贊助商
  - 業配
  - 限時優惠
  - 登入就能抽
  - 立即下載
  - 點擊下方連結

# 貼文提到這些關鍵字時，標出相關族群（族群名稱要和 themes.yaml 一致）
