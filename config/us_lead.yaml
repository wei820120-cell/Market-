# 美股領先指標 → 台股族群。前一晚美股這檔（或 ETF）大漲，台股對應族群裡「還沒跟上」的股票就排進盤前觀察名單。
# pct：前一晚漲幅超過幾 % 才算（個股波動大要求高一點，ETF 低一點）。
# themes：對應的台股族群名稱（themes.yaml 的 tw 族群，或研究產生的「研究:…」族群；找不到的名稱會自動略過）。
